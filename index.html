<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; style-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1B175A">
  <meta name="description" content="CCC Team Portal for the Cristal Clear Cleaning team.">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CCC Team">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CCC Team Portal</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css?v=0.3.4">
  <script src="config.js?v=0.3.4" defer></script>
  <script src="i18n.js?v=0.3.4" defer></script>
  <script src="api.js?v=0.3.4" defer></script>
  <script src="app.js?v=0.3.4" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" id="brand-link" href="#/home">
        <span class="brand-mark" id="brand-mark"></span>
        <span class="brand-text" id="brand-text">CCC Team Portal</span>
      </a>
      <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="en" lang="en" aria-pressed="true">English</button>
        <button type="button" class="lang-btn" data-lang="es" lang="es" aria-pressed="false">Español</button>
      </div>
    </div>
  </header>
  <div class="offline-banner" id="offline-banner" role="status" aria-live="polite" hidden></div>
  <main class="app" id="app" tabindex="-1">
    <div class="boot" id="boot">
      <div class="spinner spinner-lg" aria-hidden="true"></div>
      <p class="sr-only">Loading</p>
    </div>
  </main>
  <noscript>
    <p class="noscript">Please turn on JavaScript to use the CCC Team Portal. Por favor, active JavaScript para usar el portal.</p>
  </noscript>
</body>
</html>
